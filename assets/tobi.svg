
<svg xmlns="http://www.w3.org/2000/svg" width="240" height="260" viewBox="0 0 120 130" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">TOBI robot</title>
  <desc id="desc">A friendly white-faced robot with Racing Red details, a glowing antenna and subtle orbiting particles.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF223C" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#EF223C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF223C" stop-opacity=".09"/>
      <stop offset="100%" stop-color="#EF223C" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="60" cy="55" r="55" fill="url(#outerGlow)">
    <animate attributeName="opacity" values=".55;1;.55" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <g fill="#EF223C" opacity=".65">
    <circle cx="60" cy="5" r="1.5"><animate attributeName="opacity" values=".25;.9;.25" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="107" cy="40" r="1.5"><animate attributeName="opacity" values=".9;.25;.9" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="107" cy="70" r="1.5"><animate attributeName="opacity" values=".25;.9;.25" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="108" r="1.5"><animate attributeName="opacity" values=".9;.25;.9" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="13" cy="40" r="1.5"><animate attributeName="opacity" values=".25;.9;.25" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="13" cy="70" r="1.5"><animate attributeName="opacity" values=".9;.25;.9" dur="3.4s" repeatCount="indefinite"/></circle>
  </g>

  <circle cx="60" cy="55" r="45" fill="url(#glow)">
    <animate attributeName="r" values="43;47;43" dur="4s" repeatCount="indefinite"/>
  </circle>
  <ellipse cx="60" cy="118" rx="30" ry="5" fill="#000" opacity=".12"/>

  <g>
    <line x1="60" y1="12" x2="60" y2="26" stroke="#EF223C" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="60" cy="12" r="5" fill="#EF223C" filter="url(#softGlow)">
      <animate attributeName="r" values="4.5;5.5;4.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <ellipse cx="26" cy="48" rx="6" ry="8" fill="#EF223C" opacity=".2"/>
  <ellipse cx="94" cy="48" rx="6" ry="8" fill="#EF223C" opacity=".2"/>

  <circle cx="60" cy="52" r="30" fill="#FFF5F5" stroke="#EF223C" stroke-width="2.5"/>

  <g>
    <circle cx="47" cy="47" r="7" fill="#EF223C"/>
    <circle cx="45" cy="44.5" r="2.5" fill="#fff"/>
    <circle cx="73" cy="47" r="7" fill="#EF223C"/>
    <circle cx="71" cy="44.5" r="2.5" fill="#fff"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -1;0 0" dur="3s" repeatCount="indefinite"/>
  </g>

  <ellipse cx="37" cy="56" rx="6" ry="3" fill="#EF223C" opacity=".09"/>
  <ellipse cx="83" cy="56" rx="6" ry="3" fill="#EF223C" opacity=".09"/>
  <path d="M54 58 Q60 64 66 58" stroke="#EF223C" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <rect x="42" y="76" width="36" height="26" rx="12" fill="#EF223C"/>
  <rect x="54" y="83" width="12" height="2.5" rx="1.25" fill="#fff" opacity=".8">
    <animate attributeName="opacity" values=".35;.9;.35" dur="2s" repeatCount="indefinite"/>
  </rect>
  <rect x="56" y="89" width="8" height="2.5" rx="1.25" fill="#fff" opacity=".45"/>

  <g>
    <rect x="28" y="81" width="13" height="7" rx="3.5" fill="#EF223C" opacity=".9"/>
    <rect x="79" y="81" width="13" height="7" rx="3.5" fill="#EF223C" opacity=".9"/>
    <animateTransform attributeName="transform" type="rotate" values="0 60 85;-3 60 85;0 60 85;3 60 85;0 60 85" dur="5s" repeatCount="indefinite"/>
  </g>

  <ellipse cx="50" cy="105" rx="9" ry="4" fill="#EF223C" opacity=".15"/>
  <ellipse cx="70" cy="105" rx="9" ry="4" fill="#EF223C" opacity=".15"/>
</svg>
